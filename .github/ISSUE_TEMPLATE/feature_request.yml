name: Feature request
description: Describe a problem Rhizome could solve.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Describe the user need; you do not need to design the implementation.
        Keep private session content and credentials out of examples.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: desired-behavior
    attributes:
      label: Desired behavior
      description: How would this help? Include a concrete example if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches you have tried.
