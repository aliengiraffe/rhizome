version: '3'

vars:
  TOOLS: '{{.ROOT_DIR}}/.bin'
  PROTOC: '{{.PROTOC | default "protoc"}}'

tasks:
  tools:
    desc: Install pinned Go protobuf generators into .bin
    env:
      GOBIN: '{{.TOOLS}}'
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.4.0

  proto:
    desc: Regenerate Go protobuf bindings (requires protoc)
    deps: [tools]
    cmds:
      - PATH="{{.TOOLS}}:$PATH" "{{.PROTOC}}" --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative proto/*.proto

  build:
    desc: Build the rhizome executable
    cmds:
      - go build .

  check:
    desc: Run Go vet and race tests
    cmds:
      - go vet ./...
      - go test -race ./...

  test-plugin:
    desc: Run OpenCode plugin tests (Node 20+; skipped when node is absent)
    cmds:
      - 'if command -v node >/dev/null 2>&1; then node --test plugins/opencode/*.test.mjs; else echo "node not found; skipping plugin tests"; fi'
